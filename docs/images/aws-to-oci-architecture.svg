<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1580" viewBox="0 0 1920 1580" role="img" aria-labelledby="title desc">
<title id="title">AWS to OCI full boot-disk image migration</title>
<desc id="desc">A temporary Ubuntu EC2 builder in an AWS VPC is captured as an AMI and EBS snapshot. VM Import/Export exports a VMDK into private S3. A Windows operator computer downloads, uploads into private OCI Object Storage and verifies the complete file by SHA-256 readback. OCI imports a custom image and launches one VM in a separate VCN. Packages, configuration, SQLite records, HTTP and OCI metadata are verified. The AWS builder is removed after capture. Networking and cloud identity are created separately.</desc>
